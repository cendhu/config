set -g default-terminal "screen-256color"
set -g allow-passthrough all
set -g passthrough-all on

# Pass Kitty window ID for graphics protocol detection
set -ga update-environment ' KITTY_WINDOW_ID KITTY_INSTALLATION_DIR'
set -g visual-activity off
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/'

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 15000

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z
bind S setw synchronize-panes

set -g mouse on

set-window-option -g mode-keys vi
set -sg escape-time 0

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sidebar'


set -g @catppuccin_window_status_icon_enable "no"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_status_modules_right "... cpu ..."


set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality
set -g @resurrect-dir '~/.config/tmux/resurrect-data'

set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename off
set-option -g allow-rename off

# Active pane border - bright green, inactive - dim gray
set -g pane-border-lines heavy
set -g pane-active-border-style fg=green,bold
set -g pane-border-style fg=colour238

# Pane border labels - active pane highlighted in green
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=green bold] #P: #{pane_current_command} #[default], #P: #{pane_current_command} }"

# Subtly dim inactive panes (transparent bg)
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

# Alert when a window has activity or bell
set -g visual-bell off
set -g bell-action any
set-window-option -g monitor-bell on
set-window-option -g monitor-activity off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)

run '~/.config/tmux/plugins/tpm/tpm'
