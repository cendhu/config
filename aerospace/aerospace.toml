# AeroSpace config - syncs workspace changes with sketchybar
config-version = 2

# Start AeroSpace at login and start SketchyBar when AeroSpace starts/restarts.
start-at-login = true
after-startup-command = ['exec-and-forget sketchybar']

# Don't hijack cmd-h / cmd-alt-h (macOS hide app)
# Also prevents aerospace from interfering with cmd-based app shortcuts (e.g. cmd-1 for Ghostty tabs)
automatically-unhide-macos-hidden-apps = true

# Trigger sketchybar on workspace change
exec-on-workspace-change = [
  '/bin/dash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED=$AEROSPACE_FOCUSED_WORKSPACE PREV_FOCUSED=$AEROSPACE_PREV_WORKSPACE',
]

# Trigger sketchybar on focus change + move mouse to focused window
on-focus-changed = [
  'move-mouse window-lazy-center',
  'exec-and-forget sketchybar --trigger aerospace_focus_change',
]

# Move mouse to focused monitor when switching monitors
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Keep workspaces alive even when empty
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7"]

# Workspace-to-monitor assignment
# WS 1-4 → right (BenQ EW3270U), WS 5-7 → left (BenQ PD2700U)
# Array syntax: patterns tried in order, first match wins
# - Exact monitor name regex (e.g. '^BenQ EW3270U$')
# - 'main' = macOS primary display
# - 'secondary' = any non-primary display
# - 'built-in retina display' = laptop screen
# When laptop only: BenQ patterns won't match → falls to 'secondary' → the single display
[workspace-to-monitor-force-assignment]
1 = ['BenQ EW3270U', 'main', 'secondary']
2 = ['BenQ EW3270U', 'main', 'secondary']
3 = ['BenQ EW3270U', 'main', 'secondary']
4 = ['BenQ EW3270U', 'main', 'secondary']
5 = ['BenQ PD2700U', 'secondary']
6 = ['BenQ PD2700U', 'secondary']
7 = ['BenQ PD2700U', 'secondary']

# Top padding for SketchyBar.
# SketchyBar height is 37px; macOS menu bar is set to auto-hide always.
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.right = 0
outer.top = [
  { monitor."BenQ EW3270U" = 37 },
  { monitor."BenQ PD2700U" = 37 },
  10,
]

# Default keybindings for workspace switching
[mode.main.binding]
# Switch to workspace (alt prefix)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'

# Layout control. alt-slash toggles horizontal/vertical tiles;
# alt-comma toggles accordion. Use alt-slash to snap back to side-by-side tiling
# if a workspace ever gets stuck stacking windows behind each other.
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Keep Ghostty in the tiling tree. Existing floating windows still need one
# manual/runtime `aerospace layout tiling` after config reload.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout tiling'

# glimpse browser (Plannotator) has no bundle-id, so match by app-name.
[[on-window-detected]]
if.app-name-regex-substring = 'glimpse'
run = 'layout tiling'
